name: Convex Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex functions
    runs-on: ubuntu-latest
    # The user stores the Convex credentials in a GitHub Environment
    # named CONVEX_DEPLOYMENT (repo Settings > Environments).
    environment: CONVEX_DEPLOYMENT
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        working-directory: apps/web
        run: npm install

      - name: Deploy to Convex
        working-directory: apps/web
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "--- Deploy attempt $attempt/3 ---"
            if npx convex deploy --typecheck=disable; then
              echo "Deploy succeeded."
              exit 0
            fi
            echo "Deploy failed (attempt $attempt); waiting 15s before retrying..."
            sleep 15
          done
          echo "All deploy attempts failed."
          exit 1
